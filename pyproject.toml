[project]
name = "stockpilot"
version = "0.1.0"
description = "Autonomous equity trading bot for Alpaca paper trading"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "venv", "__pycache__", "reports", "data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import order)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
]
ignore = [
    "E501",    # line length handled by the formatter
    "B008",    # FastAPI dependency-injection defaults
    "SIM105",  # contextlib.suppress is not always clearer
    "UP042",   # str+Enum is intentional: values must compare equal to plain str
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# structlog must be configured before the application modules import their loggers
"main.py" = ["E402"]
"backtest/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]

