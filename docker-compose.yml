services:
  bot:
    build: .
    container_name: stockpilot-bot
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/')"]
      interval: 60s
      timeout: 10s
      retries: 3
